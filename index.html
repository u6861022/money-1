<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 個人記帳系統 v2 (雲端同步版)</title>
    <!-- 引入 Tailwind CSS 和 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 SheetJS 用於匯出入 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- 頂部標題與總計資訊 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-6 flex justify-center items-center gap-2">
                💰 個人記帳系統 v2 <span id="syncStatus" class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-medium animate-pulse">正在同步雲端...</span>
            </h1>
            
            <div class="grid grid-cols-3 gap-4">
                <div class="p-4 bg-red-50 rounded-xl">
                    <p class="text-sm text-gray-500 font-medium mb-1">篩選後總支出</p>
                    <p id="totalExpense" class="text-xl font-bold text-red-600">$0</p>
                </div>
                <div class="p-4 bg-blue-50 rounded-xl">
                    <p class="text-sm text-gray-500 font-medium mb-1">篩選後筆數</p>
                    <p id="totalCount" class="text-xl font-bold text-blue-600">0</p>
                </div>
                <div class="p-4 bg-green-50 rounded-xl">
                    <p class="text-sm text-gray-500 font-medium mb-1">平均每筆</p>
                    <p id="avgExpense" class="text-xl font-bold text-green-600">$0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- 新增記帳區塊 -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">➕ 新增記帳</h2>
                <form id="recordForm" class="space-y-4" onsubmit="event.preventDefault(); addRecord();">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">日期</label>
                            <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">類型</label>
                            <select id="typeInput" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="日常伙食">日常伙食</option>
                                <option value="交通娛樂">交通娛樂</option>
                                <option value="生活雜支">生活雜支</option>
                                <option value="固定開銷">固定開銷</option>
                                <option value="其他支出">其他支出</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">金額</label>
                        <input type="number" id="amountInput" min="1" placeholder="請輸入支出金額" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">備註</label>
                        <input type="text" id="noteInput" placeholder="說明或商家名稱" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition duration-200 text-sm">
                        新增記錄
                    </button>
                </form>
            </div>

            <!-- 篩選查詢區塊 -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">🔍 篩選查詢</h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">開始日期</label>
                            <input type="date" id="filterStart" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">結束日期</label>
                            <input type="date" id="filterEnd" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">類型</label>
                            <select id="filterType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="全部類型">全部類型</option>
                                <option value="日常伙食">日常伙食</option>
                                <option value="交通娛樂">交通娛樂</option>
                                <option value="生活雜支">生活雜支</option>
                                <option value="固定開銷">固定開銷</option>
                                <option value="其他支出">其他支出</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">備註關鍵字</label>
                            <input type="text" id="filterKeyword" placeholder="搜尋備註..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 pt-1">
                        <button onclick="applyFilter()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 rounded-lg transition duration-200 text-sm">
                            套用篩選
                        </button>
                        <button onclick="clearFilter()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 rounded-lg transition duration-200 text-sm">
                            清除篩選
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 圖表分析區塊 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">📊 分類支出比例</h2>
                <div class="relative h-64 flex justify-center items-center">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">📈 每月支出趨勢</h2>
                <div class="relative h-64 flex justify-center items-center">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 資料備份與本地管理區塊 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">💾 資料備份與備用工具</h2>
            <div class="flex flex-wrap gap-3">
                <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-sm transition">📤 匯出 Excel</button>
                <label class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-sm transition cursor-pointer">
                    📥 匯入 Excel / CSV
                    <input type="file" id="importFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="importFromFile(this)">
                </label>
                <button onclick="downloadJsonBackup()" class="bg-gray-600 hover:bg-gray-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-sm transition">下載 JSON 備份</button>
                <button onclick="clearAllDataData()" class="bg-red-50 hover:bg-red-100 text-red-600 font-medium px-4 py-2 rounded-lg text-sm transition">⚠️ 清除本地快取</button>
            </div>
            <p class="text-xs text-gray-400 mt-2">💡 提示：本系統已啟用 Google Sheets 雲端連線，出門在外用手機登入也會自動加載與儲存。此處按鈕可用於手動備份防丟失。</p>
        </div>

        <!-- 記帳明細列表 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">📋 記帳明細</h2>
                <div class="flex items-center gap-2">
                    <label for="detailYear" class="text-sm font-medium text-gray-600">年</label>
                    <select id="detailYear" onchange="applyFilter()" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="">全部年份</option>
                    </select>
                    <label for="detailMonth" class="text-sm font-medium text-gray-600">月</label>
                    <select id="detailMonth" onchange="applyFilter()" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="">全部月份</option>
                        <option value="01">1 月</option>
                        <option value="02">2 月</option>
                        <option value="03">3 月</option>
                        <option value="04">4 月</option>
                        <option value="05">5 月</option>
                        <option value="06">6 月</option>
                        <option value="07">7 月</option>
                        <option value="08">8 月</option>
                        <option value="09">9 月</option>
                        <option value="10">10 月</option>
                        <option value="11">11 月</option>
                        <option value="12">12 月</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="py-3 px-4">日期</th>
                            <th class="py-3 px-4">類型</th>
                            <th class="py-3 px-4">金額</th>
                            <th class="py-3 px-4">備註</th>
                            <th class="py-3 px-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="text-gray-700 text-sm divide-y divide-gray-50">
                        <!-- 動態插入明細 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 1. 設定你的 Google Apps Script 雲端 API 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzFDo5UdjmYIYuMm0Do3kQ2raXiIcHsi7JQRHS4sIkG6cE598y03fP5wbu717XpO3Ks/exec";

        // 全域陣列：存放當前所有的記帳資料
        let records = [];
        let filteredRecords = [];

        // 圖表物件參照
        let pieChartInstance = null;
        let barChartInstance = null;

        // 取得使用者本地時區的今日日期，避免 toISOString() 在午夜附近造成日期偏移
        function getLocalDateString(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 建立「記帳明細」年／月下拉選單，預設為目前年月
        function initializeDetailFilters() {
            const today = new Date();
            const currentYear = String(today.getFullYear());
            const currentMonth = String(today.getMonth() + 1).padStart(2, '0');

            populateYearOptions(currentYear);
            const monthSelect = document.getElementById('detailMonth');
            if (monthSelect) monthSelect.value = currentMonth;
        }

        // 年份選項依目前資料動態建立，保留使用者當前選擇
        function populateYearOptions(preferredYear = null) {
            const yearSelect = document.getElementById('detailYear');
            if (!yearSelect) return;

            const currentYear = String(new Date().getFullYear());
            const currentValue = preferredYear !== null ? String(preferredYear) : yearSelect.value;
            const years = new Set([currentYear]);

            records.forEach(r => {
                const match = String(r.date || '').match(/^(\d{4})-/);
                if (match) years.add(match[1]);
            });

            const sortedYears = Array.from(years).sort((a, b) => Number(b) - Number(a));
            yearSelect.innerHTML = '<option value="">全部年份</option>';
            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });

            if (currentValue && sortedYears.includes(currentValue)) {
                yearSelect.value = currentValue;
            } else {
                yearSelect.value = currentValue === '' ? '' : currentYear;
            }
        }

        // 初始化預設今日日期
        document.getElementById('dateInput').value = getLocalDateString();

        // 🔄 網頁初始化載入流程
        window.onload = function() {
            initializeDetailFilters();
            loadLocalCache(); // 先加載本地快取，避免畫面空白
            fetchCloudData(); // 異步非同步抓取雲端最新資料
        };

        // 讀取本地快取
        function loadLocalCache() {
            const saved = localStorage.getItem('records');
            if (saved) {
                try {
                    records = JSON.parse(saved);
                    populateYearOptions();
                    applyFilter();
                } catch(e) {
                    console.error("解析本地快取出錯", e);
                }
            }
        }

        // 從雲端 Google Sheets 獲取資料
        function fetchCloudData() {
            const statusLabel = document.getElementById('syncStatus');
            statusLabel.textContent = "正在同步雲端...";
            statusLabel.className = "text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-medium animate-pulse";

            fetch(GAS_URL)
            .then(res => res.json())
            .then(cloudData => {
                if (Array.isArray(cloudData)) {
                    console.log(`雲端同步成功，共 ${cloudData.length} 筆資料。`);
                    
                    // 格式化與修復雲端拿到的日期與金額
                    records = cloudData.map(item => {
                        let d = item.date;
                        if (d && d.includes('T')) d = d.split('T')[0];
                        return {
                            date: d || getLocalDateString(),
                            type: item.type || "其他支出",
                            amount: Number(item.amount) || 0,
                            note: item.note || ""
                        };
                    });

                    // 排序：依日期新到舊排序
                    records.sort((a, b) => new Date(b.date) - new Date(a.date));

                    // 更新本地快取備份
                    localStorage.setItem('records', JSON.stringify(records));
                    
                    // 保留目前的篩選條件並更新介面；初次載入預設顯示目前年月
                    populateYearOptions();
                    applyFilter();

                    statusLabel.textContent = "雲端已同步";
                    statusLabel.className = "text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-medium";
                }
            })
            .catch(err => {
                console.warn("無法連接雲端資料庫，使用本地快取運行中:", err);
                statusLabel.textContent = "離線模式";
                statusLabel.className = "text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium";
            });
        }

        // ➕ 新增記帳記錄
        function addRecord() {
            const date = document.getElementById('dateInput').value;
            const type = document.getElementById('typeInput').value;
            const amount = Number(document.getElementById('amountInput').value);
            const note = document.getElementById('noteInput').value;

            if (!date || !type || isNaN(amount) || amount <= 0) {
                alert("請填寫正確的日期、類別及金額");
                return;
            }

            const newRecord = { date, type, amount, note };

            // 1. 優先塞入前端本地陣列，讓畫面秒速更新，提升使用者體驗
            records.unshift(newRecord);
            localStorage.setItem('records', JSON.stringify(records));
            applyFilter(); // 重新套用當前篩選渲染

            // 清空輸入框
            document.getElementById('amountInput').value = "";
            document.getElementById('noteInput').value = "";

            // 2. 背景非同步同步傳送到雲端 Google Sheets
            const statusLabel = document.getElementById('syncStatus');
            statusLabel.textContent = "正在同步新記錄到雲端...";
            statusLabel.className = "text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-medium animate-pulse";

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newRecord)
            })
            .then(() => {
                console.log("新記錄已安全儲存至雲端。");
                statusLabel.textContent = "雲端已同步";
                statusLabel.className = "text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-medium";
            })
            .catch(err => {
                console.error("上傳雲端失敗，資料目前保留在手機/電腦本地快取：", err);
                statusLabel.textContent = "上傳失敗(暫存本地)";
                statusLabel.className = "text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full font-medium";
            });
        }

        // ❌ 刪除記帳明細 (因為是去中心化純前端串接，刪除優先刪除本地快取，若要連試算表同步刪除，建議直接去 Google Sheet 表格中整行刪除)
        function deleteRecord(index) {
            if (confirm("確定要刪除這筆紀錄嗎？(注意：此操作會將該筆從本地快取和當前視圖中移除)")) {
                const target = filteredRecords[index];
                const realIndex = records.findIndex(r => r === target);
                if (realIndex !== -1) {
                    records.splice(realIndex, 1);
                    localStorage.setItem('records', JSON.stringify(records));
                    applyFilter();
                }
            }
        }

        // 🔍 篩選與查詢邏輯
        function applyFilter() {
            const start = document.getElementById('filterStart').value;
            const end = document.getElementById('filterEnd').value;
            const type = document.getElementById('filterType').value;
            const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();
            const selectedYear = document.getElementById('detailYear').value;
            const selectedMonth = document.getElementById('detailMonth').value;

            filteredRecords = records.filter(r => {
                const recordDate = String(r.date || '');
                const recordYear = recordDate.substring(0, 4);
                const recordMonth = recordDate.substring(5, 7);

                if (selectedYear && recordYear !== selectedYear) return false;
                if (selectedMonth && recordMonth !== selectedMonth) return false;
                if (start && recordDate < start) return false;
                if (end && recordDate > end) return false;
                if (type !== "全部類型" && r.type !== type) return false;
                if (keyword && (!r.note || !String(r.note).toLowerCase().includes(keyword))) return false;
                return true;
            });

            updateUI();
        }

        // 清除篩選
        function clearFilter() {
            document.getElementById('filterStart').value = "";
            document.getElementById('filterEnd').value = "";
            document.getElementById('filterType').value = "全部類型";
            document.getElementById('filterKeyword').value = "";
            document.getElementById('detailYear').value = "";
            document.getElementById('detailMonth').value = "";
            applyFilter();
        }

        // 🖥️ 更新並渲染所有介面與圖表
        function updateUI() {
            renderTable();
            renderStats();
            renderCharts();
        }

        // 渲染表格資料
        function renderTable() {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = "";

            if (filteredRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400 italic">查無記帳資料</td></tr>`;
                return;
            }

            filteredRecords.forEach((r, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono">${r.date}</td>
                    <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs ${getTypeBadgeClass(r.type)}">${r.type}</span></td>
                    <td class="py-3 px-4 font-bold text-gray-900">$${r.amount.toLocaleString()}</td>
                    <td class="py-3 px-4 text-gray-500 max-w-xs truncate" title="${r.note || ''}">${r.note || '-'}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteRecord(${idx})" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 樣式標籤匹配
        function getTypeBadgeClass(type) {
            switch(type) {
                case '日常伙食': return 'bg-orange-100 text-orange-800';
                case '交通娛樂': return 'bg-blue-100 text-blue-800';
                case '生活雜支': return 'bg-purple-100 text-purple-800';
                case '固定開銷': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 計算頂部面板數字
        function renderStats() {
            const total = filteredRecords.reduce((sum, r) => sum + r.amount, 0);
            const count = filteredRecords.length;
            const avg = count > 0 ? Math.round(total / count) : 0;

            document.getElementById('totalExpense').textContent = `$${total.toLocaleString()}`;
            document.getElementById('totalCount').textContent = count.toLocaleString();
            document.getElementById('avgExpense').textContent = `$${avg.toLocaleString()}`;
        }

        // 📊 建立與刷新 Chart.js 圖表
        function renderCharts() {
            // 1. 分類支出統計 (圓餅圖)
            const typeMap = {};
            filteredRecords.forEach(r => {
                typeMap[r.type] = (typeMap[r.type] || 0) + r.amount;
            });
            const pieLabels = Object.keys(typeMap);
            const pieData = Object.values(typeMap);

            if (pieChartInstance) pieChartInstance.destroy();
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: pieLabels,
                    datasets: [{
                        data: pieData,
                        backgroundColor: ['#f97316', '#3b82f6', '#a855f7', '#ef4444', '#6b7280']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });

            // 2. 每月趨勢統計 (長條圖)
            const monthMap = {};
            filteredRecords.forEach(r => {
                if (r.date) {
                    const month = r.date.substring(0, 7); // 擷取 YYYY-MM
                    monthMap[month] = (monthMap[month] || 0) + r.amount;
                }
            });
            // 依月份排序
            const sortedMonths = Object.keys(monthMap).sort();
            const barData = sortedMonths.map(m => monthMap[m]);

            if (barChartInstance) barChartInstance.destroy();
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: sortedMonths,
                    datasets: [{
                        label: '總支出',
                        data: barData,
                        backgroundColor: '#4f46e5',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } }
                }
            });
        }

        // 📤 匯出資料至 Excel
        function exportToExcel() {
            if (records.length === 0) {
                alert("目前沒有任何記帳資料可供匯出！");
                return;
            }
            const worksheetData = [["日期", "類型", "金額", "備註"]];
            records.forEach(r => worksheetData.push([r.date, r.type, r.amount, r.note]));
            
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            XLSX.utils.book_append_sheet(wb, ws, "記帳明細");
            XLSX.writeFile(wb, `記帳本備份_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // 📥 匯入本地 Excel / CSV
        function importFromFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                if (json.length <= 1) {
                    alert("檔案內無有效資料或格式不符");
                    return;
                }

                const importedRecords = [];
                // 從第二列開始（跳過標題）
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (!row || row.length < 3) continue;

                    let rawDate = row[0];
                    let formattedDate = "";

                    // 修復 Excel 日期序號
                    if (typeof rawDate === 'number') {
                        const dateObj = XLSX.SSF.parse_date_code(rawDate);
                        const y = dateObj.y;
                        const m = String(dateObj.m).padStart(2, '0');
                        const d = String(dateObj.d).padStart(2, '0');
                        formattedDate = `${y}-${m}-${d}`;
                    } else if (rawDate) {
                        formattedDate = String(rawDate).trim().substring(0, 10);
                    }

                    importedRecords.push({
                        date: formattedDate || getLocalDateString(),
                        type: String(row[1] || "其他支出").trim(),
                        amount: Number(row[2]) || 0,
                        note: row[3] ? String(row[3]).trim() : ""
                    });
                }

                if (importedRecords.length > 0) {
                    if (confirm(`成功解析出 ${importedRecords.length} 筆資料，是否要「覆蓋」現有電腦/手機的本地記帳快取？`)) {
                        records = importedRecords;
                        records.sort((a, b) => new Date(b.date) - new Date(a.date));
                        localStorage.setItem('records', JSON.stringify(records));
                        filteredRecords = [...records];
                        updateUI();
                        alert("本地快取資料匯入成功！(提示：若要同步至雲端，請在新畫面單筆點擊或手動上傳試算表)");
                    }
                }
            };
            reader.readAsArrayBuffer(file);
            input.value = ""; // 清空
        }

        // 下載 JSON 備份檔
        function downloadJsonBackup() {
            if (records.length === 0) {
                alert("無記帳資料可備份！");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `記帳備份_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 清除本地緩存
        function clearAllDataData() {
            if (confirm("確定要清除當前手機/電腦上的瀏覽器快取嗎？此操作不會刪除你 Google 試算表上的資料。")) {
                localStorage.removeItem('records');
                records = [];
                filteredRecords = [];
                updateUI();
                alert("本地快取已清空，可重新整理網頁重新從雲端抓取。");
            }
        }
    </script>
</body>
